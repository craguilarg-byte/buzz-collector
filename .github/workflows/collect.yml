name: collect-mentions

on:
  schedule:
    # 12:30 and 21:00 America/Panama (UTC-5, no DST) = 17:30 and 02:00 UTC.
    # GitHub cron is best-effort: expect runs 0-30 min late at busy times.
    - cron: "17 17 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect_mentions.py
      - name: commit snapshot
        run: |
          git config user.name "buzz-collector"
          git config user.email "buzz-collector@users.noreply.github.com"
          git add data/mentions
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
